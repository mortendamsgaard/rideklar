name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deploy on bad data or a regression rather than shipping it.
      # `npm run build` also runs validate:programs via its prebuild hook.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The boot path is only observable in a real browser: whether the shipped
      # HTML carries a readable programme, and whether a stale page whose
      # chunks have been deleted recovers. Runs against the build above.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
